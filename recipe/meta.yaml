{% set name = "occt" %}
{% set version = "8.0.1" %}
# Base above conda-forge's 0: with the variant offsets this yields
# novtk_*_103 / all_*_203, so a realthunder build is distinguishable from
# (and preferred over) conda-forge's 100/200 at equal channel priority.
# Bump it with the source URL: the version stays 8.0.1 while the fork moves.
{% set build = 3 %}

{% set build = build + 100 %}   # [variant == "novtk"]
{% set build = build + 200 %}   # [variant == "all"]


package:
  name: {{ name }}
  version: {{ version }}

source:
  # The realthunder OCCT fork: upstream V8_0_1 plus the fork's kernel
  # work, branch LinkVibe-801.  Pinned by commit rather than branch so
  # the build is reproducible; bump the URL and the sha256 together to
  # pick up new fork work.
  #
  # A GitHub archive of that commit rather than git_url/git_rev: conda-build
  # answers a git source with a full `git clone --mirror`, and this fork is
  # 227 MB of history across 97 tags.  The Unix runners absorb that; the
  # Windows ones do not -- both win_64 jobs of run 32801141274 sat on
  # "Cloning into bare repository" for 2h59m without reaching the compile.
  # The archive is 60 MB, unpacks in seconds, and is the form conda-forge's
  # own occt recipe uses.  Nothing here reads the GIT_* variables a git
  # source would have set.
  url: https://github.com/realthunder/OCCT/archive/73a69404669e2dc5c302c43c11c167e71c964efd.tar.gz
  sha256: 5b500f64fb8535b624b85e9304ab6c44e358f6158af16966ea5d8c5cb4e90bb5
  patches:
    # conda-forge's patch; verified to apply to the fork tree, which
    # does not touch that CMake region.
    - patches/switch-vtk-freetype-cmake-order.patch

build:
  number: {{ build }}
  string: {{ variant }}_h{{ PKG_HASH }}_{{ build }}
  run_exports:
    # ABI changes between minor versions, see e.g.
    # https://github.com/conda-forge/occt-feedstock/issues/97
    - {{ pin_subpackage('occt', max_pin='x.x.x') }}
  script_env:
    - USE_VTK=OFF  # [variant=='novtk']
    - USE_VTK=ON  # [variant=='all']

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - git
    - ninja
  host:
    - expat
    - fontconfig
    - freeimage
    - freetype
    - libgl-devel                   # [linux]
    - rapidjson
    - tbb-devel                     # [variant=='all']
    - vtk                           # [variant=='all']
    - xorg-libx11                   # [linux]
    - xorg-libxt                    # [linux]
    - xorg-xorgproto                # [linux]
    - xorg-libxext                  # [linux]
    - xorg-libxi                    # [linux]
  run:
    - freetype
    - freeimage
    - fontconfig
    - xorg-libxt  # [linux]
    - rapidjson
    - vtk  # [variant=='all']

test:
  requires:
    - ninja
    - cmake
  files:
    - CMakeLists.txt
  commands:
    - cmake -G "Ninja" -DOCCT_VERSION="{{ version }}" .

about:
  home: https://www.opencascade.com/
  license_family: LGPL
  license: LGPL-2.1-only
  license_file: LICENSE_LGPL_21.txt
  summary: this is the occ (opencascade) CAD-Kernel
  description: |
    Open Cascade Technology (OCCT), formerly called CAS.CADE
    is an open source software development platform for 3D CAD,
    CAM, CAE, etc. that is developed and supported by Open Cascade SAS.
  doc_url: https://www.opencascade.com/content/documentation
  dev_url: http://git.dev.opencascade.org/gitweb/?p=occt.git

extra:
  recipe-maintainers:
    - adam-urbanczyk
    - oursland
    - adrianinsaval
    - looooo
