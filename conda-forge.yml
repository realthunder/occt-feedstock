build_platform:
  linux_aarch64: linux_64
  osx_arm64: osx_64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  # ppc64le is emulated, slow, and nothing downstream of this fork runs
  # on it.  osx and win are what freecad-rt ships on, so they build here
  # rather than on the Azure setup this fork does not have.
  linux_64: github_actions
  linux_aarch64: github_actions
  linux_ppc64le: None
  osx_64: github_actions
  osx_arm64: github_actions
  win_64: github_actions
test: native_and_emulated
